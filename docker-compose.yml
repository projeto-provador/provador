services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: provador
      POSTGRES_PASSWORD: provador
      POSTGRES_DB: provador
    ports:
      - "5432:5432"
    volumes:
      - provador_pgdata:/var/lib/postgresql/data

volumes:
  provador_pgdata:
